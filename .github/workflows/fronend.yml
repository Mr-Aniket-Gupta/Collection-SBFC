name: Frontend CI

on:
  push:
    paths:
      - "Frontend/**"
  pull_request:
    paths:
      - "Frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Packages
        run: npm ci

      - name: Build Project
        run: npm run build
