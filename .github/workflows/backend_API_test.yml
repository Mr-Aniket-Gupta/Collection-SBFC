name: Backend API Health Test

on:
  push:
    branches:
      - main
    paths:
      - "Backend/**"

  pull_request:
    branches:
      - main
    paths:
      - "Backend/**"

jobs:
  api-health-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Packages
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      - name: Start API
        run: |
          nohup dotnet run --urls=http://localhost:5166 > api.log 2>&1 &
          echo "API starting..."

      - name: Wait for API to Start
        run: |
          echo "Waiting for API..."

          for i in {1..30}
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5166/api/health || true)

            if [ "$STATUS" = "200" ]; then
              echo "API is running."
              exit 0
            fi

            sleep 2
          done

          echo "API failed to start."
          cat api.log
          exit 1

      - name: Test Health Endpoint
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" http://localhost:5166/api/health)

          echo "HTTP Status: $STATUS"
          echo ""
          echo "Response:"
          cat response.json
          echo ""

          if [ "$STATUS" != "200" ]; then
            echo "Health endpoint failed."
            exit 1
          fi

      - name: Show API Log
        if: always()
        run: |
          echo "========== API LOG =========="
          cat api.log || true
          echo "============================="

      - name: Upload API Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: Backend/api.log