# unused imports
# unused variables
# hook dependency issues
# code quality issues

name: Frontend Lint

on:
  push:
    paths:
      - "Frontend/**"

  pull_request:
    paths:
      - "Frontend/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci

      - run: npm run lint
