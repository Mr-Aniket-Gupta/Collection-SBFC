name: Backend CI

on:
  push:
    paths:
      - "Backend/**"
  pull_request:
    paths:
      - "Backend/**"

jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore
